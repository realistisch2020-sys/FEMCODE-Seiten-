<!DOCTYPE html>

<style>

    --orange-2:#ffb347;
    --text:#f7f1ea;
    --text-soft:#c9b4a3;
    --wa-green:#25d366;

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;

  }

  .details{
    display:flex;flex-direction:column;gap:4px;
    font-size:15px;color:var(--text-soft);margin:0 0 22px;
    font-weight:600;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:16px 20px;border-radius:999px;font-weight:700;font-size:16px;
