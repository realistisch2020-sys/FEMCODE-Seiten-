<style>
/* Layout: eine schmale Spalte, Glas-Karten auf wandernden Farbwolken in Weinrot, Beere, Rosé und Pfirsich */
:root{
  --wine:#4B1230;
  --berry:#B03A66;
  --rose:#F7C6D0;
  --blush:#FFF0F2;
  --peach:#FFD6C2;
  --gold:#F0B27A;
  --ink:#2A1220;
  --muted:#6E5560;
  --line:rgba(75,18,48,.12);
  --glass:rgba(255,255,255,.74);
  --font:Arial, Helvetica, sans-serif;
  --bt:8s;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(160deg,#FFF3F5 0%,#FFE4E9 48%,#FFEEE2 100%) fixed;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.6;z-index:-1;pointer-events:none}
.b1{width:340px;height:340px;background:var(--rose);top:-90px;left:-110px;animation:drift 22s ease-in-out infinite}
.b2{width:300px;height:300px;background:var(--peach);top:38%;right:-120px;animation:drift 26s ease-in-out -8s infinite reverse}
.b3{width:320px;height:320px;background:#E9A9C0;bottom:-120px;left:10%;opacity:.45;animation:drift 30s ease-in-out -14s infinite}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:26px 20px 56px}
.brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--berry);margin:0 0 22px;font-weight:700}
h1,h2,h3{font-family:var(--font);margin:0;text-wrap:balance;line-height:1.18;color:var(--wine)}
h1{font-size:36px;font-weight:700;letter-spacing:-.015em}
h2{font-size:25px;font-weight:700}
h3{font-size:19px;font-weight:700}
.grad{background:linear-gradient(100deg,var(--wine),var(--berry) 55%,#E0775A);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0}
.lead{margin-top:16px}
.small{font-size:14px;color:var(--muted);line-height:1.5}
.stack{display:flex;flex-direction:column;gap:12px}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 10px 34px rgba(75,18,48,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* Bewegung */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinback{to{transform:rotate(-360deg)}}
@keyframes flip{0%,55%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,36px) scale(1.12)}}
@keyframes breathe{0%,100%{transform:scale(.66)}50%{transform:scale(1.1)}}
@keyframes glow{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:.9;transform:scale(1.2)}}
@keyframes lblin{0%,6%{opacity:0}14%,42%{opacity:1}50%,100%{opacity:0}}
@keyframes lblout{0%,50%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}
@keyframes shimmer{from{background-position:-220% 0}to{background-position:220% 0}}
@keyframes pulse{0%,100%{box-shadow:0 8px 22px rgba(176,58,102,.28)}50%{box-shadow:0 8px 36px rgba(176,58,102,.52)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(90deg)}}
.rise{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}

/* Buttons */
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:var(--font);font-size:17px;font-weight:700;padding:17px 20px;border-radius:999px;border:0;color:#fff;cursor:pointer;background:linear-gradient(100deg,var(--wine),var(--berry) 50%,var(--wine));background-size:220% 100%;animation:pulse 3.2s ease-in-out infinite;transition:transform .18s}
.btn:hover{transform:translateY(-2px);animation:pulse 3.2s ease-in-out infinite,shimmer 1.4s linear infinite}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--wine);border:2px solid var(--wine);animation:none}
.btn.ghost:hover{background:#fff;animation:none}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
#focus:focus,#focus:focus-visible{outline:none}

/* Start */
.hero{display:flex;justify-content:center;margin:4px 0 18px}
.mandala{width:150px;height:150px;filter:drop-shadow(0 10px 22px rgba(176,58,102,.25))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips span{font-size:13px;color:var(--wine);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:99px;padding:6px 12px}

/* Fragen */
.progress{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
.progress span{font-size:14px;color:var(--muted)}
.bar{height:8px;background:rgba(255,255,255,.8);border-radius:99px;overflow:hidden;margin-bottom:26px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--berry),#E0775A,var(--berry));background-size:220% 100%;animation:shimmer 3s linear infinite;transition:width .4s}
.back{background:none;border:0;font-family:var(--font);font-size:14px;color:var(--berry);cursor:pointer;padding:6px 0;text-decoration:underline}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.qhead h2{flex:1}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:var(--font);font-size:17px;line-height:1.4;color:var(--ink);background:var(--glass);border:2px solid rgba(255,255,255,.9);border-radius:18px;padding:15px 16px;cursor:pointer;box-shadow:0 6px 18px rgba(75,18,48,.06);transition:transform .18s,border-color .18s,background .18s;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.opt::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--rose);background:#fff;transition:all .18s}
.opt:hover{transform:translateY(-2px);border-color:var(--rose)}
.opt[aria-pressed="true"]{border-color:var(--berry);background:#fff}
.opt[aria-pressed="true"]::before{border-color:var(--berry);background:radial-gradient(circle,var(--berry) 45%,#fff 50%)}

/* Icons */
.ico{position:relative;display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;flex:none;perspective:200px}
.ico .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--berry);opacity:.65;animation:spin 14s linear infinite}
.ico .core{position:absolute;inset:7px;border-radius:50%;background:linear-gradient(140deg,#fff,var(--rose))}
.ico svg{position:relative;width:26px;height:26px;color:var(--wine);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:flip 7s ease-in-out infinite}
.ico.sm{width:40px;height:40px}.ico.sm svg{width:19px;height:19px}.ico.sm .core{inset:5px}
.ico.lg{width:64px;height:64px}.ico.lg svg{width:30px;height:30px}

/* Atmen */
.breathcard{padding:22px 20px 20px;text-align:center;margin-bottom:26px}
.breath{position:relative;width:210px;height:210px;margin:14px auto 6px}
.breath .halo{position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(224,119,90,.55),rgba(176,58,102,0) 68%);animation:glow var(--bt) ease-in-out infinite}
.breath .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--rose) 34%,var(--berry) 100%);box-shadow:0 14px 40px rgba(176,58,102,.35),inset 0 -10px 24px rgba(75,18,48,.18);animation:breathe var(--bt) ease-in-out infinite}
.breath .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--wine);opacity:0;letter-spacing:.02em}
.breath .lin{animation:lblin var(--bt) ease-in-out infinite}
.breath .lout{animation:lblout var(--bt) ease-in-out infinite}
.breath .still{display:none}
.sparkle{position:absolute;width:14px;height:14px;color:var(--gold);fill:currentColor;animation:twinkle 4s ease-in-out infinite}

/* Ergebnis */
.badge{display:inline-block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);background:rgba(255,255,255,.8);border:1px solid var(--line);padding:6px 12px;border-radius:99px;margin-bottom:14px}
.profile{margin-top:26px;padding:22px 20px}
.profile h3{margin-bottom:16px}
.row{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;margin-bottom:18px}
.row .ico{grid-row:1 / span 2}
.row:last-child{margin-bottom:0}
.row b{font-size:16px}
.row em{font-style:normal;font-size:13px;color:var(--muted)}
.track{grid-column:1 / -1;margin-top:6px;height:9px;background:#fff;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--berry),#E0775A);transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,.4s)}
.sec{margin:34px 0 6px}
.step{padding:22px 20px;position:relative;overflow:hidden}
.step .top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.step .num{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--berry);font-weight:700}
.step .btn{margin-top:18px}
.prod{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.prod li{padding-left:14px;border-left:3px solid var(--rose)}
.prod a{color:var(--berry);font-weight:700}
.price{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.price span{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px}
.contact{margin-top:28px;border-radius:24px;padding:26px 22px;color:#fff;background:linear-gradient(140deg,var(--wine),#7C2250 60%,var(--berry));box-shadow:0 14px 36px rgba(75,18,48,.3)}
.contact h3{color:#fff;margin-bottom:10px}
.contact a{color:#fff}
.contact p+p{margin-top:6px}

.feature{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,var(--berry),var(--gold),var(--wine)) border-box;box-shadow:0 16px 44px rgba(176,58,102,.22)}
.ribbon{display:inline-block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#fff;background:linear-gradient(100deg,var(--berry),#E0775A);padding:6px 12px;border-radius:99px;margin-bottom:14px}
.why{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.why li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.why svg{width:24px;height:24px;margin-top:1px;fill:none;stroke:var(--berry);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.why b{color:var(--wine)}
.price .rec{background:linear-gradient(100deg,var(--berry),#E0775A);color:#fff;border-color:transparent;font-weight:700}

@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes ripple{from{transform:scale(1);opacity:.5}to{transform:scale(1.7);opacity:0}}
.voice{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:22px}
.pbtn{position:relative;flex:none;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(140deg,var(--wine),var(--berry));box-shadow:0 8px 22px rgba(176,58,102,.35);display:flex;align-items:center;justify-content:center}
.pbtn::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--berry);opacity:0}
.voice.playing .pbtn::after{animation:ripple 1.8s ease-out infinite}
.pbtn svg{width:24px;height:24px;fill:currentColor}
.pbtn .ps{display:none}
.voice.playing .pbtn .pp{display:none}
.voice.playing .pbtn .ps{display:block}
.vtxt{flex:1;min-width:0}
.vtxt b{display:block;color:var(--wine);font-size:16px;line-height:1.25}
.vtxt .small{display:block;margin-top:2px}
.vbar{height:6px;background:#fff;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:9px}
.vbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--berry),#E0775A);border-radius:99px}
.wavebars{display:flex;align-items:center;gap:3px;height:24px;flex:none}
.wavebars i{display:block;width:3px;height:100%;border-radius:3px;background:var(--berry);transform:scaleY(.3);transform-origin:center}
.voice.playing .wavebars i{animation:wave .9s ease-in-out infinite}
.wavebars i:nth-child(2){animation-delay:-.2s!important}.wavebars i:nth-child(3){animation-delay:-.45s!important}.wavebars i:nth-child(4){animation-delay:-.7s!important}

.dots{display:flex;gap:12px;justify-content:center;margin-top:16px}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--rose);transition:all .4s}
.dots i.on{background:var(--berry);border-color:var(--berry);transform:scale(1.15)}
.promo{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#FFF0F2,#FFE0D2);border:1px solid var(--line)}
.promo .old{font-size:20px;color:var(--muted);text-decoration:line-through}
.promo .now{font-size:34px;font-weight:700;color:var(--wine);line-height:1}
.promo .txt{flex:1;font-size:15px;line-height:1.4}
.code{display:inline-block;margin-top:6px;font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(100deg,var(--berry),#E0775A);padding:6px 14px;border-radius:99px}
.copy{margin-left:8px;font-family:var(--font);font-size:14px;color:var(--berry);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px 0}
[hidden]{display:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .breath .lin,.breath .lout{display:none}
  .breath .still{display:flex;opacity:1}
  .breath .orb{transform:scale(.9)}
}
</style>
</head>

function saveState(scroll){
  try{ localStorage.setItem(KEY, JSON.stringify({answers:answers, view:view, scroll:scroll||0})); }catch(e){}
}
var app = document.getElementById("app");

function ext(href, text, cls){
  return '<a class="'+(cls||"")+'" href="'+href+'" target="_blank" rel="noopener noreferrer">'+text+'</a>';
}
function brand(){ return '<p class="brand">Safe to Thrive · Petra Tanner</p>'; }

function mandala(){
  var petals = "";
  for(var i=0;i<8;i++){ petals += '<ellipse cx="60" cy="30" rx="11" ry="25" transform="rotate('+(i*45)+' 60 60)"/>'; }

  for(var j=0;j<8;j++){ inner += '<ellipse cx="60" cy="42" rx="6" ry="13" transform="rotate('+(j*45+22.5)+' 60 60)"/>'; }

}

function sparkle(style){

}

    '<div class="hero rise">'+mandala()+'</div>' +

    '<p class="lead rise" style="--d:.2s">Wie gut wird dein Darm gerade unterstützt? Beantworte 10 kurze Fragen und finde heraus, wo dein Körper mehr Raum braucht.</p>' +
    '<p class="lead rise" style="--d:.3s">Am Ende bekommst du deine Einladung zum gemeinsamen Darmreset über 20 Tage.</p>' +
    '<div class="glass voice rise" style="--d:.35s"><button class="pbtn" id="play" type="button" aria-label="Sprachnachricht abspielen oder pausieren"><svg class="pp" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="ps" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>' +
    '<div class="vtxt"><b>Hör kurz rein</b><span class="small">Petra spricht zu dir · <span id="vtime">1:55</span></span><div class="vbar" aria-hidden="true"><i id="vfill"></i></div></div>' +
    '<div class="wavebars" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>' +

  document.getElementById("go").onclick = function(){ stopVoice(); answers = []; renderQuestion(0); };

function renderQuestion(i){
  view = "q" + i; saveState();
  var Q = QUESTIONS[i];
  var pct = Math.round(((i+1)/QUESTIONS.length)*100);
  var html = brand() +
    '<div class="progress"><span>Frage '+(i+1)+' von '+QUESTIONS.length+'</span><button class="back" id="back" type="button">Zurück</button></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>' +
    '<div class="qhead rise">'+icon(Q.area)+'<h2 tabindex="-1" id="focus">'+Q.q+'</h2></div><div class="stack">';
  Q.o.forEach(function(t, k){
    html += '<button class="opt" type="button" data-k="'+k+'" style="--d:'+(0.08+k*0.07).toFixed(2)+'s" aria-pressed="'+(answers[i]===k)+'">'+t+'</button>';
  });
  html += '</div>';
  app.innerHTML = html;
  document.getElementById("back").onclick = function(){ if(timer){clearTimeout(timer);} i===0 ? renderStart() : renderQuestion(i-1); };
  var opts = app.querySelectorAll(".opt");
  Array.prototype.forEach.call(opts, function(b){
    b.onclick = function(){
      if(timer){ clearTimeout(timer); }
      answers[i] = parseInt(b.getAttribute("data-k"),10); saveState();
      Array.prototype.forEach.call(opts, function(x){ x.setAttribute("aria-pressed", x===b ? "true":"false"); });
      timer = setTimeout(function(){
        i+1 < QUESTIONS.length ? renderQuestion(i+1) : renderResult();
      }, 320);
    };
  });
  focusTop();
}

function compute(){
  var sums = {}, total = 0, flagged = false;
  Object.keys(AREAS).forEach(function(a){ sums[a]=0; });
  QUESTIONS.forEach(function(Q, i){
    if(Q.safety){ flagged = (answers[i] === 1); return; }
    sums[Q.area] += answers[i];
    total += answers[i];
  });
  return {sums:sums, total:total, flagged:flagged};
}

function levelOf(total){
  if(total <= 8) return {
    badge:"Ergebnis 1 von 3",
    title:"Dein Bauch ist gut unterwegs",
    text:"Du gibst deinem Körper schon vieles, was er braucht. Der Darmreset ist für dich eine schöne Gelegenheit, dein inneres Milieu zu pflegen und dranzubleiben, gemeinsam mit anderen Frauen und Männern, die dasselbe tun."
  };
  if(total <= 17) return {
    badge:"Ergebnis 2 von 3",
    title:"Dein Bauch sendet leise Signale",
    text:"Du funktionierst, und trotzdem spürst du, dass da mehr Leichtigkeit möglich wäre. Genau dafür gibt es den 20-Tage-Darmreset: ein klarer Plan, kleine Schritte und Begleitung in der Gruppe."
  };
  return {
    badge:"Ergebnis 3 von 3",
    title:"Dein Bauch bittet um Aufmerksamkeit",
    text:"Deine Antworten zeigen, dass dein Körper gerade mehr Ruhe und Struktur braucht. Das ist kein Fehler an dir. Mit dem Darmreset bekommst du einen klaren Rahmen und Menschen an deiner Seite. Wenn Beschwerden stark sind oder neu auftreten, lass sie bitte zusätzlich ärztlich abklären."
  };
}

function areaLabel(ratio){
  if(ratio <= 0.34) return "stabil";
  if(ratio <= 0.67) return "braucht Aufmerksamkeit";
  return "steht im Fokus";
}

function fmt(t){ t=Math.max(0,Math.floor(t||0)); var m=Math.floor(t/60), x=t%60; return m+":"+(x<10?"0":"")+x; }
function bindVoice(){
  var a=document.getElementById("voice"), btn=document.getElementById("play");
  if(!a||!btn) return;
  var box=btn.closest(".voice"), fill=document.getElementById("vfill"), tm=document.getElementById("vtime");
  function sync(){
    box.classList.toggle("playing", !a.paused);
    var d=a.duration||0;
    fill.style.width = d ? (a.currentTime/d*100)+"%" : "0";
    tm.textContent = d ? (a.paused && a.currentTime===0 ? fmt(d) : fmt(a.currentTime)+" / "+fmt(d)) : "1:55";
  }
  a.ontimeupdate=sync; a.onplay=sync; a.onpause=sync; a.onloadedmetadata=sync; a.onended=function(){ a.currentTime=0; sync(); };
  btn.onclick=function(){
    if(a.paused){ var pr=a.play(); if(pr&&pr.catch){ pr.catch(function(){}); } } else { a.pause(); }
  };
  sync();
}
function stopVoice(){ var a=document.getElementById("voice"); if(a){ try{ a.pause(); }catch(e){} } }

function focusTop(){
  window.scrollTo(0,0);
  var f = document.getElementById("focus");
  if(f){ try{ f.focus({preventScroll:true}); }catch(e){} }
}

/* Beim Zurückkommen (zum Beispiel von Telegram oder TISSO) an der alten Stelle weitermachen */
document.addEventListener("click", function(e){
  var a = e.target.closest ? e.target.closest("a[href]") : null;
  if(a && view === "result"){ saveState(window.pageYOffset || document.documentElement.scrollTop || 0); }
});
(function init(){
  var st = null;
  try{ st = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  if(st && st.answers && st.view){
    answers = st.answers;
    if(st.view === "result" && answers.length >= QUESTIONS.length){
      showResult();
      if(st.scroll){ window.scrollTo(0, st.scroll); }
      return;
    }
    var m = /^q(\d+)$/.exec(st.view);
    if(m){ renderQuestion(Math.min(parseInt(m[1],10), QUESTIONS.length-1)); return; }
  }
  renderStart();
})();
</script>
